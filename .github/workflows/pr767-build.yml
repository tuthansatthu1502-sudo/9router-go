name: Build PR 767 temporary binary
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-767
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build web assets
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Test changed packages
        run: go test ./internal/proxy/... ./internal/providers/...
      - name: Build Linux amd64 binary
        run: |
          go build -trimpath -ldflags='-s -w' -o 9router-go-linux-amd64 ./cmd/9router-go/
          sha256sum 9router-go-linux-amd64 > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 9router-pr767-linux-amd64
          path: |
            9router-go-linux-amd64
            SHA256SUMS.txt
          retention-days: 7
